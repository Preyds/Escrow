<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradescrow - Secure Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Three.js Library for 3D Interaction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        /* Custom keyframes to simulate continuous, non-linear random floating movement */
        @keyframes driftRandomly {
            0% { transform: translate(0px, 0px); }
            20% { transform: translate(50px, -30px); }
            40% { transform: translate(-30px, 60px); }
            60% { transform: translate(40px, 40px); }
            80% { transform: translate(-50px, -40px); }
            100% { transform: translate(0px, 0px); }
        }

        .animate-bg-random {
            animation: driftRandomly 15s ease-in-out infinite;
        }

        #logo3dCanvas {
            cursor: grab;
            touch-action: none;
        }
        #logo3dCanvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col justify-center items-center px-4 py-12 relative overflow-hidden select-none">

    <!-- Full-Screen Preloader / Page Transition Overlay -->
    <div id="preloader" class="fixed inset-0 z-50 bg-gray-950 flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="relative flex items-center justify-center">
            <!-- Pulsing outer ring -->
            <div class="absolute w-28 h-28 rounded-full border-2 border-yellow-500/30 animate-ping"></div>
            <!-- Animated Spinner Logo -->
            <img src="logo.png" alt="Loading Tradescrow..." class="w-20 h-20 object-contain drop-shadow-[0_0_20px_rgba(234,179,8,0.6)] animate-pulse">
        </div>
        <p id="preloaderText" class="text-yellow-500 text-xs font-bold uppercase tracking-widest mt-6 animate-pulse">Initializing Portal...</p>
    </div>

    <!-- Randomly Drifting Floating Emoji Background Pattern -->
    <div class="absolute -top-[60px] -left-[60px] -right-[60px] -bottom-[60px] pointer-events-none opacity-[0.04] select-none z-0 overflow-hidden">
        <svg width="100%" height="100%" class="animate-bg-random" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="emojiPattern" width="160" height="160" patternUnits="userSpaceOnUse">
                    <text x="20" y="40" font-size="22">🎮</text>
                    <text x="100" y="40" font-size="22">⚽</text>
                    <text x="20" y="120" font-size="22">😁</text>
                    <text x="100" y="120" font-size="22">🤝</text>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#emojiPattern)" />
        </svg>
    </div>

    <!-- Main Content Container -->
    <div class="max-w-md w-full bg-gray-800 border border-gray-700 rounded-2xl p-8 shadow-xl z-10">
        <div class="text-center mb-6">
            
            <!-- 3D Interactive Canvas Container -->
            <div class="relative w-44 h-44 mx-auto flex items-center justify-center">
                <canvas id="logo3dCanvas" class="w-full h-full drop-shadow-[0_10px_25px_rgba(234,179,8,0.35)]"></canvas>
            </div>
            
            <h1 class="text-3xl font-extrabold text-yellow-500 tracking-wide mt-2">Tradescrow</h1>
            <p class="text-gray-400 text-sm mt-1">Decentralized P2P Account Escrow Portal</p>
            <p class="text-[10px] text-yellow-500/70 tracking-widest uppercase mt-1">✨ Drag or Swipe Logo to Rotate ✨</p>
        </div>

        <form id="authForm" class="space-y-5">
            <div id="emailSection">
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Enter Your Email Address</label>
                <input id="userEmail" type="email" required placeholder="name@example.com" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-yellow-500 transition">
                <p class="text-[11px] text-gray-500 mt-1.5">A secure authorization code will be sent to your inbox.</p>
            </div>

            <div id="otpSection" class="hidden">
                <label class="block text-xs font-bold uppercase tracking-wider text-yellow-500 mb-2">Enter 6-Digit Verification Code</label>
                <input id="otpToken" type="text" placeholder="123456" maxlength="6" class="w-full bg-gray-950 border border-gray-700 rounded-xl px-4 py-3.5 text-center text-xl font-bold tracking-widest text-white focus:outline-none focus:border-yellow-500 transition">
                <p class="text-[11px] text-gray-400 mt-1.5 text-center">Check your email spam folder if you don't see it right away.</p>
            </div>

            <button type="submit" id="authBtn" class="w-full bg-yellow-500 hover:bg-yellow-600 text-gray-950 font-bold py-3.5 px-4 rounded-xl shadow-lg transition duration-150 text-sm flex justify-center items-center gap-2">
                Send Secret Code →
            </button>
        </form>
    </div>

    <div class="max-w-md w-full bg-gray-800 border border-gray-700 rounded-2xl p-6 shadow-xl mt-6 z-10">
        <h2 class="text-sm font-bold uppercase tracking-wider text-yellow-500 mb-3 flex items-center gap-2">
            📖 How Tradescrow Works
        </h2>
        <div class="relative w-full aspect-video rounded-xl overflow-hidden border border-gray-700 bg-gray-950">
            <iframe class="w-full h-full" src="https://www.youtube.com/embed/4SeAcQRruh4?si=M4s1wiKFb4D5gpwq" title="Tradescrow Tutorial" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Page Loader Script -->
    <script>
        const preloader = document.getElementById('preloader');
        const preloaderText = document.getElementById('preloaderText');

        // Function to smoothly hide the preloader
        function hidePreloader() {
            if (preloader) {
                preloader.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    preloader.style.display = 'none';
                }, 500);
            }
        }

        // Function to show preloader with custom text
        function showPreloader(msg = "Loading Tradescrow...") {
            if (preloader) {
                preloaderText.textContent = msg;
                preloader.style.display = 'flex';
                preloader.classList.remove('opacity-0', 'pointer-events-none');
            }
        }

        // Hide preloader when entire page and assets load
        window.addEventListener('load', hidePreloader);
    </script>

    <!-- Interactive 3D Rotation Script -->
    <script>
        const canvas = document.getElementById('logo3dCanvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.z = 3.2;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(176, 176);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const goldLight = new THREE.PointLight(0xeab308, 2, 10);
        goldLight.position.set(2, 2, 3);
        scene.add(goldLight);

        // Load Logo Texture
        const textureLoader = new THREE.TextureLoader();
        const texture = textureLoader.load('logo.png');

        // Create 3D Shield Mesh
        const geometry = new THREE.PlaneGeometry(2.1, 2.1);
        const material = new THREE.MeshStandardMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide,
            roughness: 0.3,
            metalness: 0.4
        });

        const logoMesh = new THREE.Mesh(geometry, material);
        scene.add(logoMesh);

        // Interaction Variables
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let targetRotationY = 0;
        let targetRotationX = 0;

        function getPos(e) {
            return {
                x: e.touches ? e.touches[0].clientX : e.clientX,
                y: e.touches ? e.touches[0].clientY : e.clientY
            };
        }

        function startDrag(e) {
            isDragging = true;
            const pos = getPos(e);
            previousMousePosition = { x: pos.x, y: pos.y };
        }

        function drag(e) {
            if (!isDragging) return;
            const pos = getPos(e);
            const deltaX = pos.x - previousMousePosition.x;
            const deltaY = pos.y - previousMousePosition.y;

            targetRotationY += deltaX * 0.015;
            targetRotationX += deltaY * 0.015;

            previousMousePosition = { x: pos.x, y: pos.y };
        }

        function stopDrag() {
            isDragging = false;
        }

        // Event Listeners (Mouse & Mobile Touch)
        canvas.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', drag);
        window.addEventListener('mouseup', stopDrag);

        canvas.addEventListener('touchstart', startDrag);
        window.addEventListener('touchmove', drag);
        window.addEventListener('touchend', stopDrag);

        // Smooth Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Inertia rotation smoothing
            logoMesh.rotation.y += (targetRotationY - logoMesh.rotation.y) * 0.1;
            logoMesh.rotation.x += (targetRotationX - logoMesh.rotation.x) * 0.1;

            // Slow passive float rotation when user isn't holding it
            if (!isDragging) {
                targetRotationY += 0.005;
                targetRotationX *= 0.95; // Return pitch gently back to straight
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>

    <!-- Supabase Auth Script -->
    <script>
        const SUPABASE_URL = 'https://auxenvjsutqwuntfhsst.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF1eGVudmpzdXRxd3VudGZoc3N0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MzE1MjUsImV4cCI6MjA5NTEwNzUyNX0.ybdyD3MAMbHMeCK9Li6hbXQ9v7FtQVV4SblSxSrkxYI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentStep = 'email'; 

        const authForm = document.getElementById('authForm');
        const emailSection = document.getElementById('emailSection');
        const otpSection = document.getElementById('otpSection');
        const authBtn = document.getElementById('authBtn');

        async function checkSession() {
            const { data } = await supabaseClient.auth.getSession();
            if (data.session) {
                showPreloader("Redirecting to Dashboard...");
                window.location.href = 'dashboard.html';
            }
        }
        checkSession();

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('userEmail').value.trim().toLowerCase();

            if (currentStep === 'email') {
                authBtn.disabled = true;
                authBtn.textContent = "Sending Code...";

                const { error } = await supabaseClient.auth.signInWithOtp({ 
                    email: email,
                    options: {
                        shouldCreateUser: true
                    }
                });

                if (error) {
                    alert("Error sending code: " + error.message);
                    authBtn.disabled = false;
                    authBtn.textContent = "Send Secret Code →";
                } else {
                    emailSection.classList.add('hidden');
                    otpSection.classList.remove('hidden');
                    authBtn.disabled = false;
                    authBtn.textContent = "Verify & Access Workspace →";
                    currentStep = 'otp';
                }

            } else if (currentStep === 'otp') {
                const token = document.getElementById('otpToken').value.trim();
                authBtn.disabled = true;
                authBtn.textContent = "Verifying Code...";

                const { data, error } = await supabaseClient.auth.verifyOtp({
                    email: email,
                    token: token,
                    type: 'email'
                });

                if (error) {
                    alert("Invalid or expired code. Please try again. " + error.message);
                    authBtn.disabled = false;
                    authBtn.textContent = "Verify & Access Workspace →";
                } else {
                    showPreloader("Access Granted! Loading Workspace...");
                    window.location.href = 'dashboard.html';
                }
            }
        });
    </script>
</body>
</html>
