<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradescrow Store - Account Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fffbe6',
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04',
                            900: '#422006',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans antialiased flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="market.html" class="flex items-center gap-2 text-lg font-bold text-yellow-500 tracking-tight">
                🎮 Tradescrow Store
            </a>
            <div class="flex items-center gap-2">
                <a href="index.html" class="px-3 py-1.5 text-xs font-semibold bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg transition">
                    Dashboard
                </a>
                <a href="#sellModal" onclick="openSellModal()" class="px-3.5 py-1.5 text-xs font-bold bg-yellow-500 hover:bg-yellow-400 text-gray-950 rounded-lg transition shadow-md">
                    + Sell Account
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-6 w-full flex-1">
        
        <!-- Search & Filter Controls -->
        <div class="space-y-3 mb-6">
            <div class="relative">
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="🔍 Search by ID, title, or item keywords..." 
                    class="w-full bg-gray-900 border border-gray-800 focus:border-yellow-500 rounded-xl px-4 py-3 text-xs text-white placeholder-gray-500 outline-none transition shadow-inner">
            </div>

            <div class="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none" id="filterTabs">
                <button onclick="setFilter('All Gaming & Social IDs')" class="filter-btn active whitespace-nowrap px-4 py-2 text-xs font-bold rounded-xl bg-yellow-500 text-gray-950 transition">
                    All Gaming & Social IDs
                </button>
                <button onclick="setFilter('Free Fire')" class="filter-btn whitespace-nowrap px-4 py-2 text-xs font-bold rounded-xl bg-gray-900 text-gray-400 hover:bg-gray-800 transition">
                    🔥 Free Fire
                </button>
                <button onclick="setFilter('Instagram')" class="filter-btn whitespace-nowrap px-4 py-2 text-xs font-bold rounded-xl bg-gray-900 text-gray-400 hover:bg-gray-800 transition">
                    📸 Instagram
                </button>
                <button onclick="setFilter('TikTok')" class="filter-btn whitespace-nowrap px-4 py-2 text-xs font-bold rounded-xl bg-gray-900 text-gray-400 hover:bg-gray-800 transition">
                    🎵 TikTok
                </button>
            </div>
        </div>

        <!-- Listings Grid -->
        <div id="listingsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="col-span-full text-center py-12 bg-gray-900 border border-gray-800 rounded-2xl">
                <span class="animate-spin inline-block w-6 h-6 border-2 border-yellow-500 border-t-transparent rounded-full mb-2"></span>
                <p class="text-xs text-gray-400">Loading active marketplace listings...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-900 py-6 text-center text-xs text-gray-600">
        <div class="flex justify-center gap-4 mb-2">
            <a href="#" class="hover:underline">Dispute Policy</a>
            <span>•</span>
            <a href="#" class="hover:underline">Terms of Service</a>
        </div>
    </footer>

    <!-- Lightbox Modal -->
    <div id="imageLightbox" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden items-center justify-center p-4 z-50" onclick="closeImageLightbox()">
        <img id="lightboxImg" class="max-w-full max-h-[90vh] object-contain rounded-xl border border-gray-800" src="" alt="Proof Screenshot">
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Supabase Client Initialization
        const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
        window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let rawListingsData = [];
        let activeFilter = 'All Gaming & Social IDs';

        document.addEventListener("DOMContentLoaded", () => {
            fetchMarketplaceListings();
        });

        // 1. Fetch listings safely from Supabase
        async function fetchMarketplaceListings() {
            const gridContainer = document.getElementById('listingsGrid');
            if (!gridContainer) return;

            gridContainer.innerHTML = `
                <div class="col-span-full text-center py-12 bg-gray-900 border border-gray-800 rounded-2xl">
                    <span class="animate-spin inline-block w-6 h-6 border-2 border-yellow-500 border-t-transparent rounded-full mb-2"></span>
                    <p class="text-xs text-gray-400">Loading active marketplace listings...</p>
                </div>`;

            try {
                const { data, error } = await window.supabaseClient
                    .from('marketplace')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                rawListingsData = data || [];
                renderGrid(rawListingsData);
            } catch (err) {
                console.error("Marketplace Load Error:", err);
                gridContainer.innerHTML = `
                    <div class="col-span-full bg-red-500/10 border border-red-500/20 text-red-400 p-4 rounded-xl text-xs text-center">
                        Failed to load listings: ${err.message || 'Database Connection Error'}
                    </div>`;
            }
        }

        // 2. Render Cards to Grid
        function renderGrid(data) {
            const gridContainer = document.getElementById('listingsGrid');
            if (!gridContainer) return;
            gridContainer.innerHTML = "";

            // Fetch stored email for seller ownership verification
            const currentUserEmail = (localStorage.getItem('user_email') || '').toLowerCase().trim();

            if (!data || data.length === 0) {
                gridContainer.innerHTML = `
                    <div class="text-center py-12 bg-gray-900 border border-gray-800 rounded-2xl col-span-full px-4">
                        <p class="text-sm font-semibold text-gray-300">No listings found</p>
                        <p class="text-xs text-gray-500 mt-1">Try resetting filters or post a new account!</p>
                    </div>`;
                return;
            }

            data.forEach(item => {
                const displayImage = item.image_url || item.proof_screenshot || 'https://images.unsplash.com/photo-1612287230202-1bf1d85d1bdf?w=500&auto=format&fit=crop&q=60';
                const sellerEmail = (item.seller_email || '').toLowerCase().trim();

                // Check if current visitor owns this listing
                const isOwner = currentUserEmail && sellerEmail && (currentUserEmail === sellerEmail);

                const card = document.createElement('div');
                card.className = "bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden flex flex-col justify-between shadow-lg hover:border-gray-700 transition relative";

                card.innerHTML = `
                    <div class="h-48 w-full bg-gray-950 relative overflow-hidden border-b border-gray-800 group cursor-pointer" onclick="openImageLightbox('${displayImage}')">
                        <img src="${displayImage}" alt="Account Preview" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
                        <div class="absolute top-2.5 left-2.5 flex items-center gap-1.5">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-yellow-500 text-gray-950 uppercase tracking-wider">${item.platform || item.category || 'Asset'}</span>
                        </div>
                        ${item.level ? `<div class="absolute bottom-2.5 right-2.5"><span class="bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 font-bold px-2 py-0.5 rounded-md text-[10px]">Lvl ${item.level}</span></div>` : ''}
                    </div>
                    <div class="p-4 space-y-2.5 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[10px] text-gray-500 font-mono">ID: ${item.id ? String(item.id).substring(0,8) : 'FF-STORE'}</span>
                                <span class="text-sm font-extrabold text-cyan-400">₦${parseFloat(item.price || 0).toLocaleString()}</span>
                            </div>
                            <h4 class="text-sm font-bold text-white leading-snug break-words">${item.title || 'Untitled Asset'}</h4>
                        </div>
                        <div class="pt-3 border-t border-gray-800 space-y-2">
                            <button onclick="contactSeller('${item.contact_handle || ''}', '${item.seller_email || ''}', '${item.platform || ''}', '${item.price || 0}', '${item.title || ''}')" class="w-full bg-green-600 hover:bg-green-700 text-white text-center py-2.5 rounded-xl font-bold text-xs transition flex justify-center items-center gap-1.5 shadow-sm">
                                💬 BUY ON WHATSAPP
                            </button>
                            <a href="create.html?seller=${encodeURIComponent(item.seller_email || '')}&amount=${encodeURIComponent(item.price || 0)}&type=${encodeURIComponent(item.platform || '')}" class="w-full block bg-gray-950 border border-gray-800 hover:bg-yellow-500 hover:text-gray-950 text-gray-300 text-center py-2 rounded-xl font-bold text-xs transition">
                                🔒 Buy via Escrow Room
                            </a>
                            ${isOwner ? `
                                <button onclick="deleteListing('${item.id}', '${item.seller_email}')" class="w-full bg-red-950/40 hover:bg-red-900/60 border border-red-800/50 text-red-400 py-1.5 rounded-xl font-bold text-xs transition flex justify-center items-center gap-1">
                                    🗑️ Delete My Listing
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;

                gridContainer.appendChild(card);
            });
        }

        // 3. Delete Listing logic
        async function deleteListing(listingId, sellerEmail) {
            const currentUserEmail = (localStorage.getItem('user_email') || '').toLowerCase().trim();

            if (!currentUserEmail || currentUserEmail !== sellerEmail.toLowerCase().trim()) {
                alert("Unauthorized: You can only delete listings you posted.");
                return;
            }

            if (!confirm("Are you sure you want to delete this listing permanently?")) return;

            try {
                const { error } = await window.supabaseClient
                    .from('marketplace')
                    .delete()
                    .eq('id', listingId);

                if (error) throw error;

                alert("Listing deleted successfully!");
                fetchMarketplaceListings();
            } catch (err) {
                alert("Failed to delete listing: " + err.message);
            }
        }

        // 4. Contact Seller via WhatsApp
        function contactSeller(contactHandle, sellerEmail, platform, price, title) {
            const phone = contactHandle.replace(/[^0-9]/g, '');
            const msg = `Hello! I am interested in buying your ${platform} listing: "${title}" for ₦${parseFloat(price).toLocaleString()} on Tradescrow Store.`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // 5. Search Filter
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                renderGrid(rawListingsData);
                return;
            }

            const filtered = rawListingsData.filter(item => {
                const t = (item.title || '').toLowerCase();
                const p = (item.platform || '').toLowerCase();
                const id = String(item.id || '').toLowerCase();
                return t.includes(query) || p.includes(query) || id.includes(query);
            });

            renderGrid(filtered);
        }

        // 6. Category Filter
        function setFilter(category) {
            activeFilter = category;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn whitespace-nowrap px-4 py-2 text-xs font-bold rounded-xl bg-gray-900 text-gray-400 hover:bg-gray-800 transition";
            });

            event.target.className = "filter-btn active whitespace-nowrap px-4 py-2 text-xs font-bold rounded-xl bg-yellow-500 text-gray-950 transition";

            if (category.includes('All')) {
                renderGrid(rawListingsData);
            } else {
                const filtered = rawListingsData.filter(item => 
                    (item.platform || '').toLowerCase().includes(category.toLowerCase())
                );
                renderGrid(filtered);
            }
        }

        // 7. Lightbox controls
        function openImageLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('imageLightbox').classList.remove('hidden');
            document.getElementById('imageLightbox').classList.add('flex');
        }

        function closeImageLightbox() {
            document.getElementById('imageLightbox').classList.add('hidden');
            document.getElementById('imageLightbox').classList.remove('flex');
        }
    </script>
</body>
</html>
