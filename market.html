        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-green-600' : 'bg-red-600';
            
            toast.className = `${bgColor} text-white px-4 py-3 rounded-xl text-xs font-semibold shadow-xl transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto flex items-center gap-2`;
            
            const iconSpan = document.createElement('span');
            iconSpan.textContent = type === 'success' ? '✓' : '⚠️';

            const msgSpan = document.createElement('span');
            msgSpan.textContent = message;

            toast.appendChild(iconSpan);
            toast.appendChild(msgSpan);

            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function toggleFormFieldsByPlatform() {
            const platform = document.getElementById('assetPlatform').value;
            const gamingFields = document.getElementById('gamingFields');
            const socialFields = document.getElementById('socialFields');

            const socialPlatforms = ['Instagram', 'TikTok', 'YouTube'];

            if (socialPlatforms.includes(platform)) {

        async function fetchMarketplaceListings() {
    const gridContainer = document.getElementById('listingsGrid');
    if (!gridContainer) return;

    gridContainer.innerHTML = `
        <div class="col-span-full text-center py-12">
            <span class="animate-spin inline-block w-6 h-6 border-2 border-yellow-500 border-t-transparent rounded-full mb-2"></span>
            <p class="text-xs text-gray-400">Loading active marketplace listings...</p>
        </div>`;

    const sortVal = document.getElementById('sortOption')?.value || 'newest';

    // Fetch listings that are available or where status is null (fallback)
    let query = window.supabaseClient
        .from('marketplace')
        .select('*')
        .or('status.eq.available,status.is.null');

    if (sortVal === 'price_asc') query = query.order('price', { ascending: true });
    else if (sortVal === 'price_desc') query = query.order('price', { ascending: false });
    else query = query.order('created_at', { ascending: false });

    const isAll = !activeFilter || 
                  activeFilter.toLowerCase() === 'all' || 
                  activeFilter.includes('All Gaming');

    if (!isAll) {
        const cleanFilter = activeFilter.replace(' ID', '').trim();
        query = query.or(`platform.ilike.%${cleanFilter}%,category.ilike.%${cleanFilter}%`);
    }

    const { data, error } = await query;

    if (error) {
        console.error("Supabase Fetch Error:", error);
        gridContainer.innerHTML = `
            <div class="col-span-full bg-red-500/10 border border-red-500/20 text-red-400 p-4 rounded-xl text-xs text-center">
                Database Error: ${error.message}
            </div>`;
        return;
    }

    rawListingsData = data || [];
    renderGrid(rawListingsData);
        }
        async function deleteListing(listingId) {
    const confirmDelete = confirm("Are you sure you want to delete this listing?");
    if (!confirmDelete) return;

    const { error } = await window.supabaseClient
        .from('marketplace')
        .delete()
        .eq('id', listingId);

    if (error) {
        alert("Failed to delete: " + error.message);
    } else {
        alert("Listing removed!");
        fetchMarketplaceListings(); // Refresh grid
    }
        }
        function handleSearch() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!searchTerm) {
                renderGrid(rawListingsData);
                return;
            }
            const filtered = rawListingsData.filter(item => 
                (item.title && item.title.toLowerCase().includes(searchTerm)) || 
                (item.platform && item.platform.toLowerCase().includes(searchTerm)) ||
                (item.tags && item.tags.toLowerCase().includes(searchTerm))
            );
            renderGrid(filtered);
        }

        function applyFilters() {
            const maxPrice = parseFloat(document.getElementById('filterMaxPrice').value);
            const minLevel = parseInt(document.getElementById('filterMinLevel').value);

            let filtered = [...rawListingsData];

            if (!isNaN(maxPrice)) filtered = filtered.filter(item => item.price <= maxPrice);
            if (!isNaN(minLevel)) filtered = filtered.filter(item => (item.level || 0) >= minLevel);

            renderGrid(filtered);
            toggleFilterModal();
        }

        function resetFilters() {
            document.getElementById('filterMaxPrice').value = '';
            document.getElementById('filterMinLevel').value = '';
            renderGrid(rawListingsData);
            toggleFilterModal();
        }

                p2.className = "text-xs text-gray-500 mt-1";

                emptyBox.appendChild(p2);

                const img = document.createElement('img');
                img.src = displayImage;
                img.alt = "Account Preview";
                img.className = "w-full h-full object-cover group-hover:scale-105 transition duration-300";
                imgContainer.appendChild(img);

                const topBadges = document.createElement('div');
                topBadges.className = "absolute top-2.5 left-2.5 flex items-center gap-1.5";

                const platformBadge = document.createElement('span');
                platformBadge.className = "text-[10px] font-bold px-2 py-0.5 rounded-md bg-yellow-500 text-gray-950 uppercase tracking-wider";

                topBadges.appendChild(platformBadge);
                imgContainer.appendChild(topBadges);

                if (item.level) {
                    const levelContainer = document.createElement('div');
                    levelContainer.className = "absolute bottom-2.5 right-2.5";
                    
                    const levelSpan = document.createElement('span');

        async function handleCreateListing(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            
            const platform = document.getElementById('assetPlatform').value;
            const title = document.getElementById('assetTitle').value;
            const tags = document.getElementById('assetTags').value || '';
            const price = parseFloat(document.getElementById('assetPrice').value);
            const contact = document.getElementById('assetContact').value;
            const email = document.getElementById('sellerEmail').value;
            const imageFile = document.getElementById('assetImage').files[0];

            const socialPlatforms = ['Instagram', 'TikTok', 'YouTube'];
            const isSocial = socialPlatforms.includes(platform);

            const level = !isSocial ? (parseInt(document.getElementById('assetLevel').value) || null) : null;
            const server = !isSocial ? (document.getElementById('assetServer').value || 'Global') : null;
            const followers = isSocial ? (parseInt(document.getElementById('assetFollowers').value) || null) : null;
            const niche = isSocial ? (document.getElementById('assetNiche').value || null) : null;

            if (imageFile && imageFile.size > 5 * 1024 * 1024) {
                showToast("Image size must be less than 5MB", "error");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Publishing Listing...";

            let imageUrl = null;

            if (imageFile) {
                const fileExt = imageFile.name.split('.').pop();
                const fileName = `${Math.random()}.${fileExt}`;
                const filePath = `listings/${fileName}`;

                const { error: uploadError } = await window.supabaseClient.storage
                    .from('account-proofs')
                    .upload(filePath, imageFile);

                if (uploadError) {
                    showToast("Storage error: " + uploadError.message, "error");
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Post Advertisement";
                    return;
                }

                const { data: publicUrlData } = window.supabaseClient.storage
                    .from('account-proofs')
                    .getPublicUrl(filePath);
                
                imageUrl = publicUrlData.publicUrl;
            }

            const { error } = await window.supabaseClient
                .from('marketplace')
                .insert([{ 
                    platform: platform, 
                    title: title, 
                    level: level,
                    server: server,
                    followers: followers,
                    niche: niche,
                    tags: tags,
                    price: price, 
                    contact_handle: contact, 
                    seller_email: email,
                    image_url: imageUrl 
                }]);

            submitBtn.disabled = false;
            submitBtn.textContent = "Post Advertisement";

            if (error) {
                showToast("Error posting ad: " + error.message, "error");
                return;
            }

            showToast("Listing published successfully!", "success");
            document.getElementById('listingForm').reset();
            toggleFormFieldsByPlatform();
            closeNewListingModal();
            fetchMarketplaceListings();
        }

        async function contactSeller(phone, email, platform, price, title) {
            const formattedPrice = parseFloat(price || 0).toLocaleString();
            const textMsg = `Hello! I saw your listing on Tradescrow Store. I am interested in buying your ${platform || 'Asset'} Account ("${title || ''}") listed for ₦${formattedPrice}. Let's negotiate and open our escrow trade room!`;
            
            try {
                await emailjs.send("service_ld1knjm", "template_9mj8u8c", {
                    to_email: email,
                    asset_type: platform,
                    asset_title: title,
                    asset_price: formattedPrice
                });
            } catch (err) {
                console.error("Email notification error:", err);
            }

            const cleanPhone = (phone || '').replace(/\+/g, '').trim(); 
            const whatsappUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(textMsg)}`;
            window.open(whatsappUrl, '_blank');
        }

        function filterPlatform(platform, btnElement) {
            activeFilter = platform;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-yellow-500', 'text-gray-950', 'font-bold');
                btn.classList.add('bg-gray-900', 'text-gray-300', 'font-medium', 'border', 'border-gray-800');
            });
            btnElement.classList.remove('bg-gray-900', 'text-gray-300', 'font-medium', 'border', 'border-gray-800');
            btnElement.classList.add('bg-yellow-500', 'text-gray-950', 'font-bold');
            fetchMarketplaceListings();
        }

        fetchMarketplaceListings();            
    </script>
